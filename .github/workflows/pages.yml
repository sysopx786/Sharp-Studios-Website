name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/client
          force_orphan: true
          user_name: github-pages[bot]
          user_email: github-pages[bot]@users.noreply.github.com
      - name: Enable GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            --input - <<'EOF' || true
          {
            "build_type": "legacy",
            "source": { "branch": "gh-pages", "path": "/" }
          }
          EOF
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            --input - <<'EOF' || true
          {
            "build_type": "legacy",
            "source": { "branch": "gh-pages", "path": "/" },
            "https_enforced": true
          }
          EOF
